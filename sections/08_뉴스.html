<!--
  ============================================
  [섹션 08] NEWS (JSON 자동 로딩)
  ============================================
-->

<style>
/* ── 공통 CSS (아임웹 위젯 간 CSS 비공유 대응) ── */
:root{--bg:#050505;--card:#0c0c0c;--border:#181818;--text:#fff;--sub:#888;--muted:#444;--accent:#2dd4a8;--accent2:#6ee7c7;--max:1200px;--font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
.reveal{opacity:0;transform:translateY(30px);transition:opacity 0.7s ease,transform 0.7s ease}.reveal.visible{opacity:1;transform:translateY(0)}
.sec{padding:100px 40px;max-width:var(--max);margin:0 auto}
.sec-label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:block;font-weight:600}
.sec-heading{font-size:clamp(26px,3.5vw,40px);font-weight:700;line-height:1.3;letter-spacing:-0.5px;margin-bottom:16px}
.sec-desc{font-size:17px;line-height:1.75;color:var(--sub);max-width:560px}
.divider{width:100%;max-width:var(--max);height:1px;background:var(--border);margin:0 auto;transform:scaleX(0);transition:transform 0.8s cubic-bezier(0.4,0,0.2,1)}.divider.visible{transform:scaleX(1)}
@media(max-width:1024px){.sec{padding:80px 24px}}
@media(max-width:640px){.sec{padding:60px 20px}}

/* ── 뉴스 고유 스타일 ── */
.n-card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:all 0.4s;display:block}
.n-card:hover{transform:translateY(-4px);border-color:#2a2a2a;box-shadow:0 12px 32px rgba(0,0,0,0.4)}
.n-card-img{width:100%;aspect-ratio:16/10;overflow:hidden;background:#0a0a0a}
.n-card-img img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s}
.n-card:hover .n-card-img img{transform:scale(1.05)}
.n-card-body{padding:18px 20px 22px}
.n-card-date{font-size:12px;color:var(--muted);margin-bottom:8px}
.n-card-title{font-size:14.5px;font-weight:500;line-height:1.55;color:#ddd;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.n-card-img .n-fallback{display:none;width:100%;height:100%;position:absolute;top:0;left:0;background:linear-gradient(135deg,#14332e,#0d1f1d);align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--accent);letter-spacing:4px}
.n-card-img img.n-err{display:none}
.n-card-img img.n-err~.n-fallback{display:flex}
@media(max-width:1024px){.news-grid{grid-template-columns:repeat(2,1fr)!important}}
@media(max-width:640px){.news-grid{grid-template-columns:1fr!important}}
</style>

<section class="sec">
  <span class="sec-label reveal">Latest Updates</span>
  <h2 class="sec-heading reveal">NEWS</h2>
  <div class="news-grid" id="homeNewsGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:48px">
    <div style="text-align:center;padding:60px 0;color:var(--muted);font-size:14px;grid-column:1/-1">뉴스를 불러오는 중...</div>
  </div>
  <div style="text-align:center;margin-top:40px">
    <a class="reveal" href="https://www.fupglobalpartners.com/news" style="display:inline-block;padding:12px 32px;border:1px solid var(--border);border-radius:28px;color:var(--sub);font-size:14px;transition:all 0.3s">뉴스 더보기 <span>→</span></a>
  </div>
</section>

<div class="divider"></div>
