  [섹션 02] 미션
  ============================================

<style>
/* ── 공통 CSS (아임웹 위젯 간 CSS 비공유 대응) ── */
:root{--bg:#050505;--card:#0c0c0c;--border:#181818;--text:#fff;--sub:#888;--muted:#444;--accent:#2dd4a8;--accent2:#6ee7c7;--max:1200px;--font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
.reveal{opacity:0;transform:translateY(30px);transition:opacity 0.7s ease,transform 0.7s ease}.reveal.visible{opacity:1;transform:translateY(0)}
.sec{padding:100px 40px;max-width:var(--max);margin:0 auto}
.sec-label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:block;font-weight:600}
.sec-heading{font-size:clamp(26px,3.5vw,40px);font-weight:700;line-height:1.3;letter-spacing:-0.5px;margin-bottom:16px}
.sec-desc{font-size:17px;line-height:1.75;color:var(--sub);max-width:560px}
.divider{width:100%;max-width:var(--max);height:1px;background:var(--border);margin:0 auto;transform:scaleX(0);transition:transform 0.8s cubic-bezier(0.4,0,0.2,1)}.divider.visible{transform:scaleX(1)}
@media(max-width:1024px){.sec{padding:80px 24px}}
@media(max-width:640px){.sec{padding:60px 20px}}

/* ── 미션 고유 스타일 ── */
.mission{padding:120px 40px;max-width:var(--max);margin:0 auto;display:flex;gap:60px;align-items:flex-start}
.mission-left{flex:1}
.mission-right{flex:1;padding-top:12px}
.mission-label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:20px;display:block;font-weight:600}
.mission-heading{font-size:clamp(28px,4vw,44px);font-weight:800;line-height:1.2;letter-spacing:-1px;color:#fff}
.mission-desc{font-size:17px;line-height:1.85;color:var(--sub)}
.mission-cta{display:inline-flex;align-items:center;gap:8px;margin-top:28px;padding:12px 28px;background:var(--accent);color:#000;font-size:13px;font-weight:700;border-radius:28px;transition:all 0.3s}
.mission-cta:hover{background:var(--accent2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(45,212,168,0.25)}
@media(max-width:768px){.mission{flex-direction:column;gap:32px;padding:80px 24px}}
</style>

<section class="mission">
  <div class="mission-left">
    <span class="mission-label reveal">Brand Investment & Global Expansion</span>
    <h2 class="mission-heading reveal">We Buy, Build,<br/>and Elevate Brands.</h2>
  </div>
  <div class="mission-right">
    <p class="mission-desc reveal">우리는 브랜드를 단순히 수입하지 않습니다. 가치를 발굴하고, 전략적으로 투자하며, 글로벌 시장에서 지속 가능한 성장을 만들어냅니다.<br/><br/>한국 브랜드의 잠재력을 세계 무대에서 실현하는 것이 에프유피글로벌파트너스의 사명입니다.</p>
    <a class="mission-cta reveal" href="https://www.fupglobalpartners.com/aboutus">ABOUT US</a>
  </div>
</section>

<div class="divider"></div>
