<!--
  ============================================
  [섹션 05b] 브랜드 영상 (스크롤 도착 시 재생)
  ============================================
-->

<style>
/* ── 공통 CSS ── */
:root{--bg:#050505;--card:#0c0c0c;--border:#181818;--text:#fff;--sub:#888;--muted:#444;--accent:#2dd4a8;--accent2:#6ee7c7;--max:1200px;--font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
.reveal{opacity:0;transform:translateY(30px);transition:opacity 0.7s ease,transform 0.7s ease}.reveal.visible{opacity:1;transform:translateY(0)}
.divider{width:100%;max-width:var(--max);height:1px;background:var(--border);margin:0 auto;transform:scaleX(0);transition:transform 0.8s cubic-bezier(0.4,0,0.2,1)}.divider.visible{transform:scaleX(1)}

/* ── 영상 고유 스타일 ── */
.vid-section{padding:100px 15vw}
.vid-wrapper{
  position:relative;width:100%;aspect-ratio:16/9;
  border-radius:20px;overflow:hidden;
  background:#000;
  box-shadow:0 24px 60px rgba(0,0,0,0.5);
  border:1px solid var(--border);
}
.vid-wrapper video{
  width:100%;height:100%;object-fit:cover;
}
@media(max-width:768px){
  .vid-section{padding:40px 12px}
  .vid-wrapper{border-radius:12px;aspect-ratio:16/9;border:none;box-shadow:none}
  .vid-wrapper video{object-fit:cover}
}
</style>

<section class="vid-section">
  <div class="vid-wrapper reveal" id="vidWrap">
    <video id="fupMainVideo" muted playsinline controlsList="nodownload noplaybackrate" disablePictureInPicture>
      <source src="https://res.cloudinary.com/dqutiswqw/video/upload/FUP_%E1%84%92%E1%85%A9%E1%86%BC%E1%84%87%E1%85%A9_%E1%84%8B%E1%85%A7%E1%86%BC%E1%84%89%E1%85%A1%E1%86%BC_2K_qijahn.mp4" type="video/mp4" />
    </video>
  </div>
</section>

<script>
(function(){
  var video=document.getElementById('fupMainVideo');
  if(!video)return;

  var observer=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        video.play();
        video.controls=true;
      }else{
        video.pause();
      }
    });
  },{threshold:0.4});

  observer.observe(video);
})();
</script>

<div class="divider"></div>
