<!-- [서비스 섹션] 심야택시 — s05 tech-block 조화형 · 독립 삽입 가능 -->
<style>
.fup-taxi6{--fup-taxi6-bg:#050505;--fup-taxi6-card:#0c0c0c;--fup-taxi6-border:#181818;--fup-taxi6-text:#fff;--fup-taxi6-sub:#888;--fup-taxi6-gold:#ffb347;--fup-taxi6-gold2:#ffd08a;width:100%;max-width:100%;background:var(--fup-taxi6-bg);color:var(--fup-taxi6-text);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.fup-taxi6 *{box-sizing:border-box}.fup-taxi6 a{text-decoration:none;color:inherit}
.fup-taxi6-block{display:flex;align-items:stretch;margin:48px 15vw 0;overflow:hidden;border:1px solid var(--fup-taxi6-border);border-radius:18px;background:var(--fup-taxi6-card)}
.fup-taxi6-media{position:relative;flex:0 0 50%;overflow:hidden;background:#080808}.fup-taxi6-media::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 65%,rgba(0,0,0,.3)),linear-gradient(90deg,transparent 80%,rgba(0,0,0,.18))}
.fup-taxi6-media video{display:block;width:100%;height:100%;min-height:440px;object-fit:cover;transition:transform .7s cubic-bezier(.16,1,.3,1)}.fup-taxi6-block:hover .fup-taxi6-media video{transform:scale(1.035)}
.fup-taxi6-content{flex:1;min-width:0;max-width:100%;display:flex;flex-direction:column;justify-content:center;padding:64px 60px;background:var(--fup-taxi6-card)}
.fup-taxi6-badges{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:24px}.fup-taxi6-badge{display:inline-block;width:fit-content;padding:7px 20px;border:1px solid rgba(255,179,71,.25);border-radius:20px;background:rgba(255,179,71,.1);color:var(--fup-taxi6-gold);font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase}
.fup-taxi6-title{margin:0 0 8px;color:#fff;font-size:clamp(28px,3.5vw,36px);font-weight:800;letter-spacing:-.5px;line-height:1.3}.fup-taxi6-subtitle{margin:0 0 20px;color:var(--fup-taxi6-sub);font-size:15px;letter-spacing:.5px}
.fup-taxi6-desc{margin:0 0 28px;color:rgba(255,255,255,.7);font-size:16px;line-height:1.8}.fup-taxi6-desc strong{color:#e8d2ad;font-weight:600}
.fup-taxi6-tags{display:flex;flex-wrap:wrap;gap:8px}.fup-taxi6-tag{padding:8px 18px;border:1px solid rgba(255,179,71,.18);border-radius:20px;background:rgba(255,179,71,.07);color:var(--fup-taxi6-gold);font-size:12.5px;font-weight:500}
.fup-taxi6-cta{display:inline-flex;align-items:center;gap:8px;width:fit-content;margin-top:28px;color:var(--fup-taxi6-gold);font-size:15px;font-weight:600;transition:color .3s,transform .3s}.fup-taxi6-cta:hover{color:var(--fup-taxi6-gold2);transform:translateX(4px)}.fup-taxi6-cta svg{width:16px;height:16px;transition:transform .3s}.fup-taxi6-cta:hover svg{transform:translateX(4px)}
.fup-taxi6-note{margin:18px 0 0;color:#555;font-size:10px;line-height:1.6}.fup-taxi6-divider{width:70%;height:1px;margin:100px auto 0;background:var(--fup-taxi6-border)}
@media(max-width:768px){.fup-taxi6-block{width:calc(100% - 24px);max-width:calc(100% - 24px);min-width:0;flex-direction:column;margin:32px 12px 0}.fup-taxi6-media{width:100%;max-width:100%;min-width:0;flex:none;height:240px}.fup-taxi6-media video{max-width:100%;min-height:240px}.fup-taxi6-content{width:100%;min-width:0;max-width:100%;padding:32px 24px;overflow:hidden}.fup-taxi6-title,.fup-taxi6-subtitle,.fup-taxi6-desc,.fup-taxi6-note{width:100%;max-width:100%}.fup-taxi6-title{font-size:24px}.fup-taxi6-desc{font-size:14px}.fup-taxi6-badges,.fup-taxi6-tags{width:100%;max-width:100%;min-width:0}.fup-taxi6-badge,.fup-taxi6-tag{max-width:100%;white-space:normal}.fup-taxi6-tag{padding:6px 14px;font-size:11px}.fup-taxi6-divider{width:calc(100% - 24px);margin-top:60px}}
@media(prefers-reduced-motion:reduce){.fup-taxi6-media video,.fup-taxi6-cta,.fup-taxi6-cta svg{transition:none}}
</style>
<section class="fup-taxi6" aria-labelledby="fup-taxi6-title">

    </div>
  </div>
  <div class="fup-taxi6-divider"></div>
</section>
