<!--
  ============================================
  [섹션 09] CTA (문의하기)
  ============================================
-->

<style>
/* ── 공통 CSS (아임웹 위젯 간 CSS 비공유 대응) ── */
:root{--bg:#050505;--card:#0c0c0c;--border:#181818;--text:#fff;--sub:#888;--muted:#444;--accent:#2dd4a8;--accent2:#6ee7c7;--max:1200px;--font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
.reveal{opacity:0;transform:translateY(30px);transition:opacity 0.7s ease,transform 0.7s ease}.reveal.visible{opacity:1;transform:translateY(0)}
.sec{padding:100px 40px;max-width:var(--max);margin:0 auto}
.sec-label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:block;font-weight:600}
.sec-heading{font-size:clamp(26px,3.5vw,40px);font-weight:700;line-height:1.3;letter-spacing:-0.5px;margin-bottom:16px}
.sec-desc{font-size:17px;line-height:1.75;color:var(--sub);max-width:560px}
.divider{width:100%;max-width:var(--max);height:1px;background:var(--border);margin:0 auto;transform:scaleX(0);transition:transform 0.8s cubic-bezier(0.4,0,0.2,1)}.divider.visible{transform:scaleX(1)}
@media(max-width:1024px){.sec{padding:80px 24px}}
@media(max-width:640px){.sec{padding:60px 20px}}

/* ── CTA 고유 스타일 ── */
.cta-sec{text-align:center;padding:100px 40px;position:relative;overflow:hidden}
.cta-sec::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 100%,rgba(45,212,168,0.08),transparent)}
.cta-sec .sec-heading,.cta-sec .sec-desc{position:relative}
.cta-sec .sec-desc{margin:0 auto 40px;text-align:center}
.cta-btn{display:inline-flex;align-items:center;gap:10px;padding:16px 48px;position:relative;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-size:14px;font-weight:700;border-radius:40px;transition:all 0.4s}
.cta-btn:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(45,212,168,0.3)}
.cta-btn svg{width:16px;height:16px;transition:transform 0.3s}
.cta-btn:hover svg{transform:translateX(4px)}
@media(max-width:640px){.cta-sec{padding:72px 20px}}
</style>

<section class="cta-sec">
  <h2 class="sec-heading reveal">함께 성장할 파트너를<br/>기다리고 있습니다</h2>
  <p class="sec-desc reveal" style="text-align:center;margin:0 auto 40px">사업 제휴, 브랜드 입점, 투자 문의 등<br/>어떤 형태의 협력이든 환영합니다.</p>
  <a class="cta-btn reveal" href="https://www.fupglobalpartners.com/contact">
    문의하기
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </a>
</section>
